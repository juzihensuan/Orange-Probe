services:
  orange-probe:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/juzihensuan/orange-probe:${ORANGE_PROBE_TAG:-latest}
    container_name: orange-probe
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4174
      DATA_DIR: /app/data
      TRUST_PROXY: loopback, linklocal, uniquelocal
      GITHUB_REPOSITORY: juzihensuan/Orange-Probe
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      UPDATER_URL: http://orange-probe-updater:4180
      UPDATE_TOKEN: ${UPDATE_TOKEN}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PUBLIC_PORT:-4174}:4174"
    volumes:
      - orange-probe-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4174/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      orange-probe-updater:
        condition: service_healthy

  orange-probe-updater:
    build:
      context: .
      dockerfile: updater/Dockerfile
    image: ghcr.io/juzihensuan/orange-probe-updater:${ORANGE_PROBE_TAG:-latest}
    container_name: orange-probe-updater
    restart: unless-stopped
    environment:
      UPDATE_TOKEN: ${UPDATE_TOKEN}
      COMPOSE_PROJECT_NAME: orange-probe
      COMPOSE_FILE: /deployment/docker-compose.yml
      GITHUB_USERNAME: ${GITHUB_USERNAME:-juzihensuan}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DEPLOY_PATH:-/opt/orange-probe}:/deployment:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4180/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

volumes:
  orange-probe-data:
    name: orange-probe-data
